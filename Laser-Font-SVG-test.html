<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 純向量曲線產生器</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- 引入 Potrace.js: 將圖形/文字 100% 轉為貝茲曲線向量路徑 (Pure Bezier Vector Path) -->
    <script src="https://cdn.jsdelivr.net/npm/potrace@2.1.8/potrace.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
        }
        input[type="text"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background-color: #0066cc;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #0052a3;
        }
        .btn-download {
            background-color: #28a745;
            color: #ffffff;
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .preview-box {
            margin-top: 20px;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: auto;
        }
        .preview-box svg {
            max-width: 100%;
            height: auto;
        }
        .info-text {
            font-size: 13px;
            color: #666666;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SVG 純向量曲線產生器</h1>
    
    <div class="input-group">
        <input type="text" id="userInput" value="Eggꒉ:)و ̑̑" placeholder="請輸入文字...">
        <button class="btn-submit" onclick="generateSVG()">送出</button>
    </div>

    <div class="preview-box" id="previewBox">
        <span style="color: #999;">按下「送出」後將產生純向量曲線 (無 &lt;text&gt; 標籤)</span>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadSVG()">下載 Illustrator 向量 SVG 檔案</button>

    <div class="info-text">
        <strong>說明：</strong><br>
        本版本使用 <code>Potrace.js</code> 演算法，支援任意特殊字元/表情符號（如 <code>Eggꒉ:)و ̑̑</code>）。轉出的 SVG 只有純向量貝茲曲線（&lt;path&gt;），完全不含 &lt;text&gt; 標籤與字體宣告，Illustrator 開啟 100% 不會跳出缺少字體警告。
    </div>
</div>

<canvas id="textCanvas" style="display:none;"></canvas>

<script>
    let currentSvgString = '';

    function generateSVG() {
        const text = document.getElementById('userInput').value || "Eggꒉ:)و ̑̑";
        const previewBox = document.getElementById('previewBox');
        const downloadBtn = document.getElementById('downloadBtn');

        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d');

        const fontSize = 80;
        const fontStyle = `${fontSize}px "Roboto", "Droid Sans", Arial, sans-serif`;

        ctx.font = fontStyle;
        const textMetrics = ctx.measureText(text);

        const width = Math.max(Math.ceil(textMetrics.width) + 80, 200);
        const height = fontSize + 80;

        canvas.width = width;
        canvas.height = height;

        // 填滿白色背景，繪製黑色文字
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#000000';
        ctx.font = fontStyle;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 40, height / 2);

        // 使用 Potrace 進行貝茲曲線向量描邊
        Potrace.loadImage(canvas);
        Potrace.process(function() {
            const pathData = Potrace.getSVG(1.0);
            
            // 組裝成標準 SVG
            currentSvgString = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  ${pathData}
</svg>`;

            previewBox.innerHTML = currentSvgString;
            downloadBtn.style.display = 'block';
        });
    }

    // 頁面載入完成後自動初始化執行一次
    window.onload = function() {
        generateSVG();
    };

    function downloadSVG() {
        if (!currentSvgString) return;

        const blob = new Blob([currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vector-path.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
