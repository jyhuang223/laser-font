<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 高精細純向量曲線產生器</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- 引入 Potrace.js: 將 Canvas 圖形轉為貝茲曲線向量路徑 -->
    <script src="https://cdn.jsdelivr.net/npm/potrace@2.1.8/potrace.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
        }
        input[type="text"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background-color: #0066cc;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #0052a3;
        }
        .btn-download {
            background-color: #28a745;
            color: #ffffff;
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .preview-box {
            margin-top: 20px;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: auto;
        }
        .preview-box svg {
            max-width: 100%;
            height: auto;
        }
        .info-text {
            font-size: 13px;
            color: #666666;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SVG 高精細純向量曲線產生器 (抗鋸齒平滑優化版)</h1>
    
    <div class="input-group">
        <input type="text" id="userInput" value="Eggꒉ:)و ̑̑" placeholder="請輸入文字...">
        <button class="btn-submit" onclick="generateSVG()">送出</button>
    </div>

    <div class="preview-box" id="previewBox">
        <span style="color: #999;">按下「送出」後將產生高精細純向量曲線 (無 &lt;text&gt; 標籤)</span>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadSVG()">下載 Illustrator 高精細向量 SVG 檔案</button>

    <div class="info-text">
        <strong>鋸齒修復說明：</strong><br>
        1. 採用 <strong>8x 超高解析度採樣 (Supersampling)</strong> 渲染文字 Canvas，將特徵點提升至 800px 級別細緻度。<br>
        2. 啟用 <code>Potrace</code> 曲線最佳化擬合參數 (<code>optcurve: true</code>, <code>alphamax: 1.33</code>)，將像素邊緣完美平滑化為高階貝茲曲線。<br>
        3. 匯出的向量檔包含完美的圓弧與極細緻的字形細節，且維持 100% 純向量外框（無任何 &lt;text&gt; 標籤）。
    </div>
</div>

<canvas id="textCanvas" style="display:none;"></canvas>

<script>
    let currentSvgString = '';

    function generateSVG() {
        const text = document.getElementById('userInput').value || "Eggꒉ:)و ̑̑";
        const previewBox = document.getElementById('previewBox');
        const downloadBtn = document.getElementById('downloadBtn');

        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d');

        // 使用 8 倍高解析度放大繪製 (Supersampling) 以徹底消除鋸齒
        const scaleFactor = 8;
        const baseFontSize = 60;
        const fontSize = baseFontSize * scaleFactor; // 480px 超高解析度字體
        const fontStyle = `${fontSize}px "Roboto", "Droid Sans", Arial, sans-serif`;

        ctx.font = fontStyle;
        const textMetrics = ctx.measureText(text);

        const hiresWidth = Math.max(Math.ceil(textMetrics.width) + (100 * scaleFactor), 400 * scaleFactor);
        const hiresHeight = fontSize + (100 * scaleFactor);

        canvas.width = hiresWidth;
        canvas.height = hiresHeight;

        // 清空背景並填滿純白
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, hiresWidth, hiresHeight);

        // 在超高解析度下繪製黑色文字，確保特徵與曲線點極度充足
        ctx.fillStyle = '#000000';
        ctx.font = fontStyle;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 50 * scaleFactor, hiresHeight / 2);

        // 設定 Potrace 最佳化曲線平滑參數
        Potrace.setParameter({
            turnpolicy: "minority",
            tresh: 128,
            alphamax: 1.33,   // 允許最大弧度平滑控制
            optcurve: true,   // 開啟貝茲曲線最佳化擬合
            opttolerance: 0.2 // 擬合公差控制，越小越貼近原圖，曲線越平滑
        });

        Potrace.loadImage(canvas);
        Potrace.process(function() {
            // 取得高解析度的 SVG Path Data
            const rawSvg = Potrace.getSVG(1.0);

            // 提取內部 <path> 標籤
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawSvg, 'image/svg+xml');
            const pathNode = doc.querySelector('path');
            const pathData = pathNode ? pathNode.getAttribute('d') : '';

            // 將 ViewBox 與尺寸還原設定為目標顯示尺寸 (以 scaleFactor 縮放回正常比例，獲得超細緻的向量曲線)
            const displayWidth = Math.round(hiresWidth / scaleFactor);
            const displayHeight = Math.round(hiresHeight / scaleFactor);

            currentSvgString = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="${displayWidth}" height="${displayHeight}" viewBox="0 0 ${hiresWidth} ${hiresHeight}">
  <path d="${pathData}" fill="#000000" fill-rule="evenodd"/>
</svg>`;

            previewBox.innerHTML = currentSvgString;
            downloadBtn.style.display = 'block';
        });
    }

    window.onload = function() {
        generateSVG();
    };

    function downloadSVG() {
        if (!currentSvgString) return;

        const blob = new Blob([currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'smooth-vector-path.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
