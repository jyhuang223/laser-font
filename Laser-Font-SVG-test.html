<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>文字 → SVG 向量路徑</title>


<!-- OpenType.js -->
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 40px 20px;

    background: #f4f5f7;

    color: #222;

    font-family:
        "Roboto",
        "Droid Sans",
        Arial,
        sans-serif;

}


.container {

    width: min(100%, 1000px);

    margin: auto;

}


.header {

    margin-bottom: 25px;

}


.header h1 {

    margin: 0 0 8px;

    font-size: 28px;

}


.header p {

    margin: 0;

    color: #777;

    font-size: 14px;

}


.card {

    background: #fff;

    border-radius: 16px;

    padding: 24px;

    margin-bottom: 20px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.06);

}


label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 600;

}


textarea {

    width: 100%;

    min-height: 130px;

    resize: vertical;

    padding: 16px;

    border: 1px solid #ddd;

    border-radius: 10px;

    outline: none;

    font-family:
        "Roboto",
        "Droid Sans",
        Arial,
        sans-serif;

    font-size: 32px;

    line-height: 1.5;

    color: #000;

}


textarea:focus {

    border-color: #888;

    box-shadow:
        0 0 0 3px rgba(0,0,0,.05);

}


.settings {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 16px;

    margin-top: 18px;

}


.field {

    display: flex;

    flex-direction: column;

}


input[type="number"] {

    width: 100%;

    height: 44px;

    padding: 0 12px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 15px;

}


.buttons {

    display: flex;

    gap: 10px;

    margin-top: 20px;

    flex-wrap: wrap;

}


button {

    border: 0;

    border-radius: 9px;

    padding: 12px 22px;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

}


.btn-primary {

    background: #111;

    color: #fff;

}


.btn-primary:hover {

    background: #333;

}


.btn-download {

    background: #e9ecef;

    color: #222;

}


.btn-upload {

    background: #f1f1f1;

}


button:disabled {

    opacity: .4;

    cursor: not-allowed;

}


.preview-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 14px;

}


.preview-title h2 {

    margin: 0;

    font-size: 18px;

}


.status {

    font-size: 13px;

    color: #777;

}


.preview {

    width: 100%;

    min-height: 300px;

    border: 1px solid #ddd;

    border-radius: 12px;

    background:

        linear-gradient(
            45deg,
            #eee 25%,
            transparent 25%
        ),

        linear-gradient(
            -45deg,
            #eee 25%,
            transparent 25%
        ),

        linear-gradient(
            45deg,
            transparent 75%,
            #eee 75%
        ),

        linear-gradient(
            -45deg,
            transparent 75%,
            #eee 75%
        );

    background-size: 20px 20px;

    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: auto;

    padding: 30px;

}


.preview svg {

    display: block;

    max-width: 100%;

    height: auto;

}


.font-status {

    margin-top: 18px;

    padding: 14px 16px;

    border-radius: 10px;

    background: #f7f7f7;

    font-size: 13px;

    line-height: 1.8;

}


.font-ok {

    color: #188038;

}


.font-error {

    color: #c5221f;

}


.info {

    margin-top: 16px;

    padding: 14px 16px;

    border-radius: 9px;

    background: #f7f7f7;

    font-size: 13px;

    line-height: 1.7;

    color: #666;

}


.info strong {

    color: #222;

}


.file-upload {

    display: none;

}


@media(max-width:650px) {

    body {

        padding: 20px 12px;

    }


    .card {

        padding: 18px;

    }


    .settings {

        grid-template-columns: 1fr;

    }


    textarea {

        font-size: 24px;

    }


    .buttons {

        flex-direction: column;

    }


    button {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>
            文字 → SVG 向量路徑
        </h1>

        <p>
            Unicode 文字自動尋找 Glyph，轉換成 Illustrator 可編輯的 Path
        </p>

    </div>


    <!-- ==========================================
         輸入區
    =========================================== -->

    <div class="card">

        <label for="textInput">
            輸入文字
        </label>


        <textarea id="textInput">Eggꒉ:)و ̑̑</textarea>


        <div class="settings">


            <div class="field">

                <label for="fontSize">
                    字體大小
                </label>

                <input
                    id="fontSize"
                    type="number"
                    value="120"
                    min="10"
                    max="1000"
                >

            </div>


            <div class="field">

                <label>
                    主要字型
                </label>

                <input
                    type="text"
                    value="Roboto / Noto Sans"
                    readonly
                >

            </div>


        </div>


        <div class="buttons">


            <button
                id="generateBtn"
                class="btn-primary"
                disabled
            >
                載入字型中…
            </button>


            <button
                id="downloadBtn"
                class="btn-download"
                disabled
            >
                下載 SVG
            </button>


            <label
                for="fontFile"
                class="btn-upload"
                style="
                    display:inline-flex;
                    align-items:center;
                    justify-content:center;
                    border-radius:9px;
                    padding:12px 22px;
                    font-size:15px;
                    font-weight:600;
                    cursor:pointer;
                "
            >
                上傳 TTF / OTF 字型
            </label>


            <input
                id="fontFile"
                class="file-upload"
                type="file"
                accept=".ttf,.otf"
            >


        </div>


        <!-- 字型狀態 -->

        <div
            id="fontStatus"
            class="font-status"
        >

            正在載入字型…

        </div>


    </div>


    <!-- ==========================================
         預覽
    =========================================== -->

    <div class="card">


        <div class="preview-title">

            <h2>
                向量預覽
            </h2>

            <span
                id="status"
                class="status"
            >
                準備中
            </span>

        </div>


        <div
            id="preview"
            class="preview"
        >

            正在載入字型…

        </div>


        <div class="info">

            <strong>
                Path 向量模式
            </strong>

            <br>

            SVG 不使用
            <code>&lt;text&gt;</code>。

            <br>

            所有成功找到的字元都會轉換成真正的
            <strong>SVG Path</strong>。

            <br>

            Illustrator 開啟後可以直接編輯節點。

        </div>


    </div>


</div>



<script>

/* =========================================================
   字型網址
========================================================= */


/*
    注意：

    這裡不再使用 notofonts.github.io。

    改使用 GitHub Raw。

    如果 GitHub Pages 的瀏覽器無法載入，
    可以使用「上傳 TTF / OTF 字型」功能。
*/


const FONT_URLS = {


    roboto: [

        "https://raw.githubusercontent.com/googlefonts/roboto-3-classic/main/src/hinted/Roboto-Regular.ttf",

        "https://notofonts.github.io/roboto/unhinted/ttf/Roboto-Regular.ttf"

    ],


    noto: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSans/NotoSans-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSans/unhinted/ttf/NotoSans-Regular.ttf"

    ],


    yi: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSansYi/NotoSansYi-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSansYi/unhinted/ttf/NotoSansYi-Regular.ttf"

    ],


    arabic: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSansArabic/unhinted/ttf/NotoSansArabic-Regular.ttf"

    ],


    symbols: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSansSymbols2/NotoSansSymbols2-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSansSymbols2/unhinted/ttf/NotoSansSymbols2-Regular.ttf"

    ]

};



/* =========================================================
   字型容器
========================================================= */

const fonts = {

    roboto: null,

    noto: null,

    yi: null,

    arabic: null,

    symbols: null,

    uploaded: null

};



let currentSVG = "";



/* =========================================================
   DOM
========================================================= */

const textInput =
    document.getElementById("textInput");


const fontSizeInput =
    document.getElementById("fontSize");


const generateBtn =
    document.getElementById("generateBtn");


const downloadBtn =
    document.getElementById("downloadBtn");


const preview =
    document.getElementById("preview");


const status =
    document.getElementById("status");


const fontStatus =
    document.getElementById("fontStatus");


const fontFile =
    document.getElementById("fontFile");



/* =========================================================
   載入字型
========================================================= */

function loadFont(url) {

    return new Promise(

        (resolve, reject) => {


            opentype.load(

                url,

                function(error, font) {


                    if (error) {

                        reject(error);

                        return;

                    }


                    resolve(font);

                }

            );

        }

    );

}



/* =========================================================
   嘗試多個網址
========================================================= */

async function loadFontWithFallback(
    urls
) {


    let lastError = null;


    for (
        const url of urls
    ) {


        try {

            console.log(
                "嘗試載入字型：",
                url
            );


            const font =
                await loadFont(url);


            console.log(
                "字型載入成功：",
                url
            );


            return font;


        } catch(error) {


            console.warn(
                "字型載入失敗：",
                url,
                error
            );


            lastError =
                error;

        }

    }


    throw lastError;

}



/* =========================================================
   更新字型狀態
========================================================= */

function updateFontStatus() {


    const rows = [];


    function add(
        name,
        font
    ) {

        if (font) {

            rows.push(
                `<div class="font-ok">
                    ✓ ${name}：載入成功
                </div>`
            );

        } else {

            rows.push(
                `<div class="font-error">
                    ✕ ${name}：載入失敗
                </div>`
            );

        }

    }


    add(
        "Roboto",
        fonts.roboto
    );


    add(
        "Noto Sans",
        fonts.noto
    );


    add(
        "Noto Sans Yi（ꒉ）",
        fonts.yi
    );


    add(
        "Noto Sans Arabic（و）",
        fonts.arabic
    );


    add(
        "Noto Sans Symbols",
        fonts.symbols
    );


    if (fonts.uploaded) {

        rows.push(
            `<div class="font-ok">
                ✓ 使用者上傳字型：載入成功
            </div>`
        );

    }


    fontStatus.innerHTML =
        rows.join("");

}



/* =========================================================
   載入全部字型
========================================================= */

async function loadAllFonts() {


    status.textContent =
        "正在載入字型…";


    fontStatus.textContent =
        "正在載入字型…";


    /*
        不使用 Promise.all。

        某一個字型失敗，
        不會影響其他字型。
    */


    try {

        fonts.roboto =
            await loadFontWithFallback(
                FONT_URLS.roboto
            );

    } catch(error) {

        console.warn(
            "Roboto 無法載入"
        );

    }


    try {

        fonts.noto =
            await loadFontWithFallback(
                FONT_URLS.noto
            );

    } catch(error) {

        console.warn(
            "Noto Sans 無法載入"
        );

    }


    try {

        fonts.yi =
            await loadFontWithFallback(
                FONT_URLS.yi
            );

    } catch(error) {

        console.warn(
            "Noto Sans Yi 無法載入"
        );

    }


    try {

        fonts.arabic =
            await loadFontWithFallback(
                FONT_URLS.arabic
            );

    } catch(error) {

        console.warn(
            "Noto Sans Arabic 無法載入"
        );

    }


    try {

        fonts.symbols =
            await loadFontWithFallback(
                FONT_URLS.symbols
            );

    } catch(error) {

        console.warn(
            "Noto Symbols 無法載入"
        );

    }


    updateFontStatus();


    /*
        只要至少有一個字型，
        就允許使用。
    */

    const hasAnyFont =

        fonts.roboto ||
        fonts.noto ||
        fonts.yi ||
        fonts.arabic ||
        fonts.symbols;


    if (hasAnyFont) {


        generateBtn.disabled =
            false;


        generateBtn.textContent =
            "送出";


        status.textContent =
            "字型準備完成";


        /*
            自動產生測試文字
        */

        generate();


    } else {


        status.textContent =
            "遠端字型無法載入";


        fontStatus.innerHTML = `

            <div class="font-error">

                ✕ 遠端字型全部載入失敗

            </div>

            <div style="margin-top:8px;">

                請點擊上方
                「上傳 TTF / OTF 字型」

                <br>

                即可直接使用本機字型進行向量轉換。

            </div>

        `;


        /*
            即使遠端全部失敗，
            上傳字型仍然可以啟用工具。
        */

        generateBtn.disabled =
            false;


        generateBtn.textContent =
            "送出";

    }

}



/* =========================================================
   判斷 Glyph
========================================================= */

function hasGlyph(
    font,
    character
) {


    if (!font) {

        return false;

    }


    try {


        const glyph =
            font.charToGlyph(
                character
            );


        return (

            glyph &&

            glyph.index !== 0

        );


    } catch(error) {

        return false;

    }

}



/* =========================================================
   Unicode 分類
========================================================= */

function isYi(
    character
) {

    const code =
        character.codePointAt(0);


    return (

        code >= 0xA000 &&
        code <= 0xA4CF

    );

}



function isArabic(
    character
) {

    const code =
        character.codePointAt(0);


    return (

        (
            code >= 0x0600 &&
            code <= 0x06FF
        )

        ||

        (
            code >= 0x0750 &&
            code <= 0x077F
        )

        ||

        (
            code >= 0x08A0 &&
            code <= 0x08FF
        )

    );

}



function isCombiningMark(
    character
) {

    const code =
        character.codePointAt(0);


    return (

        (
            code >= 0x0300 &&
            code <= 0x036F
        )

        ||

        (
            code >= 0x1AB0 &&
            code <= 0x1AFF
        )

        ||

        (
            code >= 0x1DC0 &&
            code <= 0x1DFF
        )

        ||

        (
            code >= 0x20D0 &&
            code <= 0x20FF
        )

        ||

        (
            code >= 0xFE20 &&
            code <= 0xFE2F
        )

    );

}



/* =========================================================
   找到最適合的字型
========================================================= */

function getFontForCharacter(
    character
) {


    /*
        使用者上傳字型優先
    */

    if (
        fonts.uploaded &&
        hasGlyph(
            fonts.uploaded,
            character
        )
    ) {

        return fonts.uploaded;

    }



    /*
        Yi
    */

    if (isYi(character)) {

        if (
            hasGlyph(
                fonts.yi,
                character
            )
        ) {

            return fonts.yi;

        }

    }



    /*
        Arabic
    */

    if (isArabic(character)) {

        if (
            hasGlyph(
                fonts.arabic,
                character
            )
        ) {

            return fonts.arabic;

        }

    }



    /*
        Combining Mark
    */

    if (
        isCombiningMark(
            character
        )
    ) {


        if (
            hasGlyph(
                fonts.noto,
                character
            )
        ) {

            return fonts.noto;

        }


        if (
            hasGlyph(
                fonts.symbols,
                character
            )
        ) {

            return fonts.symbols;

        }

    }



    /*
        一般文字
    */

    if (
        hasGlyph(
            fonts.roboto,
            character
        )
    ) {

        return fonts.roboto;

    }



    /*
        Noto
    */

    if (
        hasGlyph(
            fonts.noto,
            character
        )
    ) {

        return fonts.noto;

    }



    /*
        Symbols
    */

    if (
        hasGlyph(
            fonts.symbols,
            character
        )
    ) {

        return fonts.symbols;

    }


    return null;

}



/* =========================================================
   取得 Glyph
========================================================= */

function getGlyphPath(
    character,
    x,
    y,
    fontSize
) {


    const font =
        getFontForCharacter(
            character
        );


    if (!font) {


        console.warn(
            "找不到 Glyph：",
            character,
            "U+" +
            character
                .codePointAt(0)
                .toString(16)
                .toUpperCase()
        );


        return {

            path: "",

            advance:
                fontSize * 0.5,

            missing: true

        };

    }



    try {


        const glyph =
            font.charToGlyph(
                character
            );


        const path =
            font.getPath(
                character,
                x,
                y,
                fontSize
            );


        let advance =

            glyph.advanceWidth *

            (
                fontSize /
                font.unitsPerEm
            );



        /*
            Combining Mark 不佔字寬
        */

        if (
            isCombiningMark(
                character
            )
        ) {

            advance = 0;

        }


        return {

            path:
                path.toPathData(3),

            advance,

            missing: false

        };


    } catch(error) {


        console.error(
            "Glyph 轉換錯誤：",
            character,
            error
        );


        return {

            path: "",

            advance:
                fontSize * 0.5,

            missing: true

        };

    }

}



/* =========================================================
   建立 SVG
========================================================= */

function createSVG(
    text,
    fontSize
) {


    const lines =
        text.split(/\r?\n/);


    const lineHeight =
        fontSize * 1.25;


    const padding =
        fontSize * 0.3;


    let lineWidths = [];


    let maxWidth = 0;



    /*
        計算文字寬度
    */

    lines.forEach(
        line => {


            let x = 0;


            const chars =
                Array.from(line);


            chars.forEach(
                character => {


                    if (
                        isCombiningMark(
                            character
                        )
                    ) {

                        return;

                    }


                    const result =
                        getGlyphPath(
                            character,
                            0,
                            0,
                            fontSize
                        );


                    x +=
                        result.advance;

                }
            );


            lineWidths.push(x);


            maxWidth =
                Math.max(
                    maxWidth,
                    x
                );

        }
    );



    if (
        maxWidth <= 0
    ) {

        maxWidth =
            fontSize;

    }



    const width =
        maxWidth +
        padding * 2;


    const height =
        Math.max(

            lines.length *
            lineHeight +
            padding * 2,

            fontSize +
            padding * 2

        );



    let pathHTML = "";



    /*
        建立 Path
    */

    lines.forEach(
        (
            line,
            lineIndex
        ) => {


            let x =
                padding;


            const baseline =

                padding +

                fontSize +

                lineIndex *
                lineHeight;



            const chars =
                Array.from(line);



            let previousX =
                x;


            let previousAdvance =
                0;



            chars.forEach(
                character => {


                    /*
                        ==================================
                        Combining Mark
                        ==================================
                    */

                    if (
                        isCombiningMark(
                            character
                        )
                    ) {


                        const markFont =
                            getFontForCharacter(
                                character
                            );


                        if (
                            markFont
                        ) {


                            try {


                                /*
                                    將組合符號放在
                                    前一個字元上方
                                */

                                const mark =
                                    markFont.getPath(

                                        character,

                                        previousX,

                                        baseline -
                                        fontSize * 0.72,

                                        fontSize

                                    );


                                const markPath =
                                    mark.toPathData(3);


                                if (
                                    markPath
                                ) {


                                    pathHTML += `

                                        <path
                                            d="${markPath}"
                                            fill="#000000"
                                        />

                                    `;

                                }


                            } catch(error) {

                                console.warn(
                                    "Combining mark error",
                                    error
                                );

                            }

                        }


                        return;

                    }



                    /*
                        ==================================
                        一般字元
                        ==================================
                    */

                    const result =
                        getGlyphPath(

                            character,

                            x,

                            baseline,

                            fontSize

                        );


                    if (
                        result.path
                    ) {


                        pathHTML += `

                            <path
                                d="${result.path}"
                                fill="#000000"
                            />

                        `;

                    }


                    previousX =
                        x;


                    previousAdvance =
                        result.advance;


                    x +=
                        result.advance;

                }
            );

        }
    );



    /*
        SVG
    */

    return `<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"

    width="${width.toFixed(2)}"

    height="${height.toFixed(2)}"

    viewBox="0 0
        ${width.toFixed(2)}
        ${height.toFixed(2)}"
>

    <g fill="#000000">

        ${pathHTML}

    </g>

</svg>`;

}



/* =========================================================
   產生
========================================================= */

function generate() {


    const text =
        textInput.value;


    const fontSize =
        parseFloat(
            fontSizeInput.value
        );


    if (!text) {

        alert(
            "請先輸入文字"
        );

        return;

    }


    if (
        !fontSize ||
        fontSize <= 0
    ) {

        alert(
            "請輸入正確的字體大小"
        );

        return;

    }


    try {


        status.textContent =
            "正在轉換成向量…";


        currentSVG =
            createSVG(
                text,
                fontSize
            );


        preview.innerHTML =
            currentSVG;


        downloadBtn.disabled =
            false;


        status.textContent =
            "完成：SVG Path";


    } catch(error) {


        console.error(error);


        status.textContent =
            "轉換失敗";


        preview.innerHTML = `

            <div style="
                color:#c00;
                text-align:center;
                line-height:1.8;
            ">

                文字轉向量失敗。

                <br>

                ${error.message}

            </div>

        `;

    }

}



/* =========================================================
   下載 SVG
========================================================= */

function downloadSVG() {


    if (!currentSVG) {

        alert(
            "請先按「送出」"
        );

        return;

    }


    const blob =
        new Blob(

            [currentSVG],

            {
                type:
                    "image/svg+xml;charset=utf-8"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "text-outline.svg";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    status.textContent =
        "SVG 已下載";

}



/* =========================================================
   上傳 TTF / OTF
========================================================= */

fontFile.addEventListener(
    "change",
    function(event) {


        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {


                try {


                    fonts.uploaded =
                        opentype.parse(
                            e.target.result
                        );


                    updateFontStatus();


                    generateBtn.disabled =
                        false;


                    status.textContent =
                        "自訂字型載入完成";


                    /*
                        上傳字型後自動重新產生
                    */

                    generate();


                } catch(error) {


                    console.error(
                        error
                    );


                    alert(
                        "無法讀取這個 TTF / OTF 字型檔。"
                    );

                }

            };


        reader.readAsArrayBuffer(
            file
        );

    }
);



/* =========================================================
   Events
========================================================= */

generateBtn.addEventListener(
    "click",
    generate
);


downloadBtn.addEventListener(
    "click",
    downloadSVG
);


textInput.addEventListener(
    "keydown",
    event => {

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            generate();

        }

    }
);



/* =========================================================
   啟動
========================================================= */

loadAllFonts();

</script>
