<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字轉 SVG 純向量路徑產生器</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- opentype.js: 用於解析字型並轉為純向量路徑 (path) -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
        }
        input[type="text"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background-color: #0066cc;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #0052a3;
        }
        .btn-submit:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-download {
            background-color: #28a745;
            color: #ffffff;
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .preview-box {
            margin-top: 20px;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: auto;
        }
        .preview-box svg {
            max-width: 100%;
            height: auto;
        }
        .status {
            font-size: 14px;
            color: #666666;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SVG 純向量曲線路徑產生器</h1>
    
    <div class="status" id="status">正在載入基礎向量字型檔...</div>

    <div class="input-group">
        <input type="text" id="userInput" value="Eggꒉ:)و ̑̑" placeholder="請輸入文字...">
        <button class="btn-submit" id="submitBtn" onclick="generateSVG()" disabled>送出</button>
    </div>

    <div class="preview-box" id="previewBox">
        <span style="color: #999;">請等待字型初始化後點擊「送出」</span>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadSVG()">下載向量曲線檔案 (.svg)</button>
</div>

<script>
    let loadedFont = null;
    let currentSvgString = '';

    // 載入完整的 Roboto TTF 檔案作為外框運算基礎
    opentype.load('https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxP.ttf', function(err, font) {
        const statusEl = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const previewBox = document.getElementById('previewBox');

        if (err) {
            console.error('字型載入失敗:', err);
            statusEl.style.color = '#d9534f';
            statusEl.innerText = '字型檔載入失敗，請檢查網路連線。';
        } else {
            loadedFont = font;
            statusEl.style.color = '#28a745';
            statusEl.innerText = '✓ 向量繪製引擎已就緒，請點擊「送出」。';
            submitBtn.disabled = false;
            previewBox.innerHTML = '<span style="color: #999;">按下「送出」後將產生純外框曲線 SVG</span>';
        }
    });

    function generateSVG() {
        if (!loadedFont) {
            alert('字型檔尚未載入完成，請稍後再試');
            return;
        }

        const text = document.getElementById('userInput').value || "Eggꒉ:)و ̑̑";
        const previewBox = document.getElementById('previewBox');
        const downloadBtn = document.getElementById('downloadBtn');

        const fontSize = 72;
        const color = "#000000";

        try {
            // 透過 opentype.js 計算點陣外框並抽取點線向量數據 (d 屬性)
            const path = loadedFont.getPath(text, 20, 80, fontSize);
            const pathData = path.toPathData(4); // 取得 d="M... C... Z" 純曲線路徑

            // 計算圖形邊界
            const boundingBox = loadedFont.getBoundingBox(text, fontSize);
            const width = Math.max(Math.ceil(loadedFont.getAdvanceWidth(text, fontSize)) + 40, 120);
            const height = Math.max(Math.ceil(boundingBox.y2 - boundingBox.y1) + 50, 120);

            // 構建「完全不包含 <text>、<font> 或 style 夾帶」的純向量外框 SVG
            currentSvgString = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <!-- 純外框曲線路徑 (Path)，在 Illustrator 中無需轉外框 -->
  <path fill="${color}" d="${pathData}" />
</svg>`;

            previewBox.innerHTML = currentSvgString;
            downloadBtn.style.display = 'block';
        } catch (e) {
            console.error('曲線轉換錯誤:', e);
            alert('轉換失敗，請確定輸入內容無無效字元');
        }
    }

    function downloadSVG() {
        if (!currentSvgString) return;

        const blob = new Blob([currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vector-path.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
