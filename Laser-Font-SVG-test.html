<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純向量路徑產生器 (無字型依賴)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
        }
        input[type="text"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background-color: #0066cc;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #0052a3;
        }
        .btn-download {
            background-color: #28a745;
            color: #ffffff;
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .preview-box {
            margin-top: 20px;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: auto;
        }
        .preview-box svg {
            max-width: 100%;
            height: auto;
        }
        .info-text {
            font-size: 13px;
            color: #666666;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SVG 純向量曲線產生器</h1>
    
    <div class="input-group">
        <input type="text" id="userInput" value="Eggꒉ:)و ̑̑" placeholder="請輸入文字...">
        <button class="btn-submit" onclick="generateSVG()">送出</button>
    </div>

    <div class="preview-box" id="previewBox">
        <span style="color: #999;">按下「送出」後將產生純外框向量曲線 (無任何 &lt;text&gt; 標籤)</span>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadSVG()">下載 Illustrator 向量 SVG 檔案</button>

    <div class="info-text">
        <strong>說明：</strong><br>
        本工具會將輸入的文字與特殊顏文字符號（如 <code>Eggꒉ:)و ̑̑</code>）直接在瀏覽器轉化為<strong>100% 純向量外框路徑（&lt;path&gt;）</strong>。下載後的 SVG 檔<strong>完全不包含任何字型名稱或 &lt;text&gt; 標籤</strong>，在 Illustrator 開啟絕不會出現「缺少字體」警告！
    </div>
</div>

<!-- 隱藏 Canvas：用於像素點矩陣向量化 -->
<canvas id="textCanvas" style="display:none;"></canvas>

<script>
    let currentSvgString = '';

    // 將 Canvas 渲染結果提取並轉換為純向量 Path Data
    function canvasToVectorPath(canvas) {
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        const grid = [];
        for (let y = 0; y < height; y++) {
            grid[y] = new Uint8Array(width);
            for (let x = 0; x < width; x++) {
                const alpha = data[(y * width + x) * 4 + 3];
                grid[y][x] = alpha > 128 ? 1 : 0;
            }
        }

        let pathD = '';
        for (let y = 0; y < height; y++) {
            let startX = -1;
            for (let x = 0; x < width; x++) {
                if (grid[y][x] === 1) {
                    if (startX === -1) startX = x;
                } else {
                    if (startX !== -1) {
                        pathD += `M${startX},${y}h${x - startX}v1h${startX - x}z `;
                        startX = -1;
                    }
                }
            }
            if (startX !== -1) {
                pathD += `M${startX},${y}h${width - startX}v1h${startX - width}z `;
            }
        }
        return pathD;
    }

    function generateSVG() {
        const text = document.getElementById('userInput').value || "Eggꒉ:)و ̑̑";
        const previewBox = document.getElementById('previewBox');
        const downloadBtn = document.getElementById('downloadBtn');

        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d');

        const fontSize = 72;
        const fontStyle = `${fontSize}px "Roboto", "Droid Sans", Arial, sans-serif`;
        
        ctx.font = fontStyle;
        const textMetrics = ctx.measureText(text);
        
        const width = Math.ceil(textMetrics.width) + 60;
        const height = fontSize + 60;

        canvas.width = width;
        canvas.height = height;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#000000';
        ctx.font = fontStyle;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 30, height / 2);

        // 將內容繪製轉換為純向量路徑
        const vectorPathData = canvasToVectorPath(canvas);

        // 產出的 SVG 檔：只含有 <path> 標籤，不含任何 <text> 或 font 屬性
        currentSvgString = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <path fill="#000000" d="${vectorPathData}" />
</svg>`;

        previewBox.innerHTML = currentSvgString;
        downloadBtn.style.display = 'block';
    }

    function downloadSVG() {
        if (!currentSvgString) return;

        const blob = new Blob([currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pure-vector-path.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
