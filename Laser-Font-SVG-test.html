<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字轉 SVG 向量圖形產生器</title>
    <!-- 引入 Roboto 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- 引入 opentype.js 將字型轉換為真實向量路徑 (Path)，確保 Illustrator 能開啟向量路徑 -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
        }
        input[type="text"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background-color: #0066cc;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #0052a3;
        }
        .btn-download {
            background-color: #28a745;
            color: #ffffff;
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .preview-box {
            margin-top: 20px;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: auto;
        }
        .preview-box svg {
            max-width: 100%;
            height: auto;
        }
        .info-text {
            font-size: 13px;
            color: #666666;
            margin-top: 15px;
            line-height: 1.5;
        }
        .status {
            font-size: 14px;
            color: #d9534f;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SVG 文字轉向量路徑產生器</h1>
    
    <div class="input-group">
        <input type="text" id="userInput" value="Eggꒉ:)و ̑̑" placeholder="請輸入文字...">
        <button class="btn-submit" onclick="generateSVG()">送出</button>
    </div>

    <div id="status" class="status"></div>

    <div class="preview-box" id="previewBox">
        <span style="color: #999;">按下「送出」後將在此處顯示 SVG 向量圖形</span>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadSVG()">下載 Illustrator 向量 SVG 檔案</button>

    <div class="info-text">
        <strong>說明：</strong><br>
        本工具採用 <code>opentype.js</code> 自動將文字渲染轉換為<strong>真實的外框向量路徑 (Path)</strong>。下載後的 SVG 檔案在 Adobe Illustrator 中開啟時，會直接是可編輯點線的向量路徑（已轉外框），不會因為電腦缺乏特殊字型而發生文字遺失或轉框問題。
    </div>
</div>

<script>
    let font = null;
    let currentSvgString = '';

    // 載入預設的 Roboto 字型檔 (TTF) 用於轉路徑
    opentype.load('https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxP.ttf', function(err, loadedFont) {
        if (err) {
            console.error('字型載入失敗:', err);
            document.getElementById('status').innerText = '預設字型載入失敗，將使用純文字 SVG 備用模式。';
        } else {
            font = loadedFont;
            console.log('Roboto 字型載入成功');
        }
    });

    function generateSVG() {
        const text = document.getElementById('userInput').value || "Eggꒉ:)و ̑̑";
        const previewBox = document.getElementById('previewBox');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        status.innerText = '';

        const fontSize = 72;
        const color = "#000000";

        if (font) {
            // 使用 opentype.js 轉成真實 Path（向量路徑）
            try {
                // 計算文字邊界與寬度
                const boundingBox = font.getBoundingBox(text, fontSize);
                const width = Math.max(Math.ceil(font.getAdvanceWidth(text, fontSize)) + 40, 100);
                const height = Math.max(Math.ceil(boundingBox.y2 - boundingBox.y1) + 40, 100);
                
                // 取得向量路徑 (x: 20, y: 70 基準線)
                const path = font.getPath(text, 20, 70, fontSize);
                path.fill = color;
                const pathSvg = path.toSVG(4);

                // 組裝完整的 SVG
                currentSvgString = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <!-- 由 OpenType.js 轉換之純向量路徑 (Vector Path) -->
  <g fill="${color}">
    ${pathSvg}
  </g>
</svg>`;

                previewBox.innerHTML = currentSvgString;
                downloadBtn.style.display = 'block';
            } catch (e) {
                console.error(e);
                fallbackSVG(text, fontSize, color);
            }
        } else {
            fallbackSVG(text, fontSize, color);
        }
    }

    // 備用方案：若字型未加載完畢，直接輸出包含 <text> 標籤的 SVG
    function fallbackSVG(text, fontSize, color) {
        const width = text.length * fontSize * 0.7 + 40;
        const height = fontSize + 60;
        currentSvgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <text x="20" y="${fontSize}" font-family="Roboto, Droid Sans, Arial, sans-serif" font-size="${fontSize}" fill="${color}">${escapeXml(text)}</text>
</svg>`;
        document.getElementById('previewBox').innerHTML = currentSvgString;
        document.getElementById('downloadBtn').style.display = 'block';
    }

    function escapeXml(unsafe) {
        return unsafe.replace(/[<>&'"]/g, function (c) {
            switch (c) {
                case '<': return '&lt;';
                case '>': return '&gt;';
                case '&': return '&amp;';
                case '\'': return '&apos;';
                case '"': return '&quot;';
            }
        });
    }

    function downloadSVG() {
        if (!currentSvgString) return;

        const blob = new Blob([currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'text-vector-path.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
