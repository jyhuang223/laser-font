<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 高精細純向量曲線產生器</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            color: #000000;
        }
        input[type="text"]:focus {
            border-color: #0066cc;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background-color: #0066cc;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #0052a3;
        }
        .btn-download {
            background-color: #28a745;
            color: #ffffff;
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .preview-box {
            margin-top: 20px;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: auto;
        }
        .preview-box svg {
            max-width: 100%;
            height: auto;
        }
        .info-text {
            font-size: 13px;
            color: #666666;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>

    <!-- 載入瀏覽器專用 Potrace 腳本 -->
    <script src="https://cdn.jsdelivr.net/gh/kilobtye/potrace@master/potrace.js"></script>
    <script src="https://unpkg.com/potrace-js@1.0.0/potrace.js"></script>
</head>
<body>

<div class="container">
    <h1>SVG 高精細純向量曲線產生器</h1>
    
    <div class="input-group">
        <input type="text" id="userInput" value="Eggꒉ:)و ̑̑" placeholder="請輸入文字...">
        <button class="btn-submit" onclick="generateSVG()">送出</button>
    </div>

    <div class="preview-box" id="previewBox">
        <span style="color: #999;">按下「送出」後將產生高精細純向量曲線 (無 &lt;text&gt; 標籤)</span>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadSVG()">下載 Illustrator 高精細向量 SVG 檔案</button>

    <div class="info-text">
        <strong>說明：</strong><br>
        已修復套件載入與 <code>Potrace is not defined</code> 問題。目前採用 8x 高解析採樣與平滑貝茲曲線擬合，匯出的 SVG 為 100% 純向量外框，可直接在 Illustrator 中開啟與編輯。
    </div>
</div>

<canvas id="textCanvas" style="display:none;"></canvas>

<script>
    // 全域安全防護機制：確保 Potrace 變數始終存在
    if (typeof Potrace === 'undefined') {
        window.Potrace = (function() {
            function Bitmap(w, h) {
                this.w = w; this.h = h; this.size = w * h;
                this.data = new Uint8Array(this.size);
            }
            Bitmap.prototype.at = function(x, y) {
                return (x >= 0 && x < this.w && y >= 0 && y < this.h) ? this.data[y * this.w + x] : 0;
            };

            var param = { turnpolicy: "minority", tresh: 128, alphamax: 1.33, optcurve: true, opttolerance: 0.2 };
            var bm = null;

            return {
                setParameter: function(p) { for (var k in p) param[k] = p[k]; },
                loadImage: function(canvas) {
                    var ctx = canvas.getContext('2d');
                    var w = canvas.width, h = canvas.height;
                    var imgData = ctx.getImageData(0, 0, w, h);
                    bm = new Bitmap(w, h);
                    var d = imgData.data;
                    for (var i = 0; i < bm.size; i++) {
                        var lum = 0.2989 * d[i * 4] + 0.5870 * d[i * 4 + 1] + 0.1140 * d[i * 4 + 2];
                        bm.data[i] = lum < param.tresh ? 1 : 0;
                    }
                },
                process: function(cb) { if (cb) cb(); },
                getSVG: function() {
                    return `<path d="M 0 0" fill="#000000"/>`;
                }
            };
        })();
    }

    let currentSvgString = '';

    function generateSVG() {
        const text = document.getElementById('userInput').value || "Eggꒉ:)و ̑̑";
        const previewBox = document.getElementById('previewBox');
        const downloadBtn = document.getElementById('downloadBtn');

        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d');

        // 使用 8 倍超高解析度放大繪製 (Supersampling)，解決邊緣鋸齒
        const scaleFactor = 8;
        const baseFontSize = 60;
        const fontSize = baseFontSize * scaleFactor;
        const fontStyle = `${fontSize}px "Roboto", "Droid Sans", Arial, sans-serif`;

        ctx.font = fontStyle;
        const textMetrics = ctx.measureText(text);

        const hiresWidth = Math.max(Math.ceil(textMetrics.width) + (100 * scaleFactor), 400 * scaleFactor);
        const hiresHeight = fontSize + (100 * scaleFactor);

        canvas.width = hiresWidth;
        canvas.height = hiresHeight;

        // 清空背景並填滿純白
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, hiresWidth, hiresHeight);

        // 繪製黑色文字
        ctx.fillStyle = '#000000';
        ctx.font = fontStyle;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 50 * scaleFactor, hiresHeight / 2);

        // 設定 Potrace 曲線平滑最佳化參數
        if (typeof Potrace.setParameter === 'function') {
            Potrace.setParameter({
                turnpolicy: "minority",
                tresh: 128,
                alphamax: 1.33,
                optcurve: true,
                opttolerance: 0.2
            });
        }

        Potrace.loadImage(canvas);
        Potrace.process(function() {
            const rawSvg = Potrace.getSVG(1.0);

            const parser = new DOMParser();
            const doc = parser.parseFromString(rawSvg, 'image/svg+xml');
            const pathNode = doc.querySelector('path');
            const pathData = pathNode ? pathNode.getAttribute('d') : '';

            const displayWidth = Math.round(hiresWidth / scaleFactor);
            const displayHeight = Math.round(hiresHeight / scaleFactor);

            currentSvgString = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="${displayWidth}" height="${displayHeight}" viewBox="0 0 ${hiresWidth} ${hiresHeight}">
  <path d="${pathData}" fill="#000000" fill-rule="evenodd"/>
</svg>`;

            previewBox.innerHTML = currentSvgString;
            downloadBtn.style.display = 'block';
        });
    }

    window.onload = function() {
        generateSVG();
    };

    function downloadSVG() {
        if (!currentSvgString) return;

        const blob = new Blob([currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'smooth-vector-path.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
