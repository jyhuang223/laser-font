<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>文字轉 SVG 向量路徑</title>

<!-- OpenType.js：負責將文字 Glyph 轉成真正的 SVG Path -->
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        background: #f5f6f8;
        color: #222;
        font-family: "Roboto", "Droid Sans", Arial, sans-serif;
    }

    .container {
        width: min(100%, 1000px);
        margin: auto;
    }

    .header {
        margin-bottom: 28px;
    }

    .header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
    }

    .header p {
        margin: 0;
        color: #777;
        font-size: 14px;
    }

    .card {
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0,0,0,.06);
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    textarea {
        width: 100%;
        min-height: 130px;
        resize: vertical;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        font-family: "Roboto", "Droid Sans", Arial, sans-serif;
        font-size: 32px;
        line-height: 1.5;
        color: #000000;
        outline: none;
        transition: .2s;
    }

    textarea:focus {
        border-color: #888;
        box-shadow: 0 0 0 3px rgba(0,0,0,.05);
    }

    .settings {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 18px;
    }

    .field {
        display: flex;
        flex-direction: column;
    }

    input,
    select {
        width: 100%;
        height: 44px;
        border: 1px solid #ddd;
        border-radius: 9px;
        padding: 0 12px;
        font-size: 15px;
        background: #fff;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #888;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    button {
        border: 0;
        border-radius: 9px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: .2s;
    }

    .btn-primary {
        background: #111;
        color: white;
    }

    .btn-primary:hover {
        background: #333;
        transform: translateY(-1px);
    }

    .btn-download {
        background: #e9ecef;
        color: #222;
    }

    .btn-download:hover {
        background: #dfe3e6;
    }

    button:disabled {
        opacity: .4;
        cursor: not-allowed;
        transform: none;
    }

    .preview-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }

    .preview-title h2 {
        margin: 0;
        font-size: 18px;
    }

    .status {
        font-size: 13px;
        color: #777;
    }

    .preview {
        width: 100%;
        min-height: 280px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background:
            linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
            linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
            linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: auto;
        padding: 30px;
    }

    .preview svg {
        max-width: 100%;
        height: auto;
        display: block;
    }

    .info {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 9px;
        background: #f7f7f7;
        font-size: 13px;
        line-height: 1.7;
        color: #666;
    }

    .info strong {
        color: #222;
    }

    @media (max-width: 650px) {

        body {
            padding: 20px 12px;
        }

        .card {
            padding: 18px;
        }

        .settings {
            grid-template-columns: 1fr;
        }

        textarea {
            font-size: 24px;
        }

        .buttons {
            flex-direction: column;
        }

        button {
            width: 100%;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>文字 → SVG 向量路徑</h1>
        <p>輸入文字後轉換成 Illustrator 可編輯的向量外框</p>
    </div>

    <div class="card">

        <label for="textInput">輸入文字</label>

        <textarea id="textInput">Eggꒉ:)و ̑̑</textarea>

        <div class="settings">

            <div class="field">
                <label for="fontSize">字體大小</label>
                <input
                    id="fontSize"
                    type="number"
                    value="120"
                    min="10"
                    max="1000"
                >
            </div>

            <div class="field">
                <label for="fontSelect">字型</label>
                <select id="fontSelect">
                    <option value="roboto">Roboto</option>
                </select>
            </div>

        </div>

        <div class="buttons">

            <button
                class="btn-primary"
                id="generateBtn"
            >
                送出
            </button>

            <button
                class="btn-download"
                id="downloadBtn"
                disabled
            >
                下載 SVG 向量檔
            </button>

        </div>

    </div>


    <div class="card">

        <div class="preview-title">
            <h2>向量預覽</h2>
            <span
                class="status"
                id="status"
            >
                尚未轉換
            </span>
        </div>

        <div
            class="preview"
            id="preview"
        >
            <span style="color:#999;">
                請輸入文字後按「送出」
            </span>
        </div>

        <div class="info">
            <strong>SVG 說明：</strong><br>
            下載的 SVG 不是一般的 SVG 文字，而是由
            <strong>Path 路徑</strong>組成。
            Illustrator 開啟後可直接編輯向量節點，不需要再執行「文字 → 建立外框」。
        </div>

    </div>

</div>


<script>

/* =========================================================
   Roboto 字型
   ========================================================= */

const FONT_URL =
    "https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.1.0/files/roboto-latin-400-normal.ttf";


let font = null;
let currentSVG = "";
let currentText = "";


/* =========================================================
   載入字型
   ========================================================= */

async function loadFont() {

    const status = document.getElementById("status");

    status.textContent = "正在載入字型…";

    try {

        font = await opentype.load(FONT_URL);

        status.textContent = "字型已載入";

        console.log("Roboto loaded");

    } catch (error) {

        console.error(error);

        status.textContent =
            "字型載入失敗，請確認網路連線";

    }

}


/* =========================================================
   Escape XML
   ========================================================= */

function escapeXML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");

}


/* =========================================================
   文字轉 Path
   ========================================================= */

function createSVG(text, fontSize) {

    if (!font) {
        throw new Error("Font not loaded");
    }

    /*
        使用 OpenType.js：

        font.getPath()
        
        取得真正的 Glyph Path。
    */

    const lines = text.split("\n");

    const lineHeight = fontSize * 1.25;

    let paths = [];

    let maxWidth = 0;

    let currentY = fontSize;


    lines.forEach((line) => {

        const path = font.getPath(
            line,
            0,
            currentY,
            fontSize
        );

        const box = path.getBoundingBox();

        const width =
            box.x2 - box.x1;

        if (width > maxWidth) {
            maxWidth = width;
        }

        /*
            轉成 SVG path data
        */

        const pathData = path.toPathData(3);

        if (pathData) {

            paths.push({
                data: pathData
            });

        }

        currentY += lineHeight;

    });


    const totalHeight =
        lines.length * lineHeight;


    /*
        加一點安全邊界
    */

    const padding = fontSize * 0.15;

    const width =
        Math.max(maxWidth + padding * 2, 1);

    const height =
        Math.max(totalHeight + padding * 2, 1);


    /*
        因為 OpenType 的 Y 軸方向與 SVG 不同，
        所以使用 group transform 修正座標。
    */

    let pathHTML = "";

    paths.forEach(item => {

        pathHTML += `
        <path
            d="${item.data}"
            fill="#000000"
        />
        `;

    });


    const svg = `
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width}"
    height="${height}"
    viewBox="0 0 ${width} ${height}"
>
    <g
        fill="#000000"
        transform="translate(${padding}, ${padding})"
    >
        ${pathHTML}
    </g>
</svg>
`;

    return svg;

}


/* =========================================================
   產生 SVG
   ========================================================= */

async function generate() {

    const textInput =
        document.getElementById("textInput");

    const fontSizeInput =
        document.getElementById("fontSize");

    const preview =
        document.getElementById("preview");

    const status =
        document.getElementById("status");

    const downloadBtn =
        document.getElementById("downloadBtn");


    const text =
        textInput.value;

    const fontSize =
        parseFloat(fontSizeInput.value);


    if (!text) {

        alert("請先輸入文字");

        return;

    }


    if (!font) {

        await loadFont();

    }


    try {

        status.textContent =
            "正在轉換成向量…";


        const svg =
            createSVG(
                text,
                fontSize
            );


        currentSVG = svg;
        currentText = text;


        preview.innerHTML = svg;


        downloadBtn.disabled = false;


        status.textContent =
            "完成：已轉換為 Path 向量";

    } catch (error) {

        console.error(error);

        status.textContent =
            "轉換失敗";

        alert(
            "文字轉向量失敗。\n\n" +
            error.message
        );

    }

}


/* =========================================================
   下載 SVG
   ========================================================= */

function downloadSVG() {

    if (!currentSVG) {

        alert("請先按「送出」");

        return;

    }


    const blob =
        new Blob(
            [currentSVG],
            {
                type: "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "text-outline.svg";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(url);

}


/* =========================================================
   Events
   ========================================================= */

document
    .getElementById("generateBtn")
    .addEventListener(
        "click",
        generate
    );


document
    .getElementById("downloadBtn")
    .addEventListener(
        "click",
        downloadSVG
    );


/* Enter 快速產生 */

document
    .getElementById("textInput")
    .addEventListener(
        "keydown",
        function(e) {

            if (
                e.ctrlKey &&
                e.key === "Enter"
            ) {

                generate();

            }

        }
    );


/* 啟動時載入字型 */

loadFont();

</script>

</body>
</html>
