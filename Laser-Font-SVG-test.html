}

   Header

   Textarea
===================================================== */

    resize: vertical;

    padding: 16px;

        "Droid Sans",

}


.field {

<script>

/* =========================================================
   字型網址
========================================================= */


/*
    每個字型提供兩個來源：

    ① GitHub Raw
    ② Noto Fonts

    如果第一個失敗，
    自動嘗試第二個。
*/


const FONT_URLS = {


    /* ---------------------------------------------
       Roboto
    --------------------------------------------- */

    roboto: [

        "https://raw.githubusercontent.com/googlefonts/roboto-3-classic/main/src/hinted/Roboto-Regular.ttf",

        "https://notofonts.github.io/roboto/unhinted/ttf/Roboto-Regular.ttf"

    ],



    /* ---------------------------------------------
       Noto Sans
    --------------------------------------------- */

    noto: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSans/NotoSans-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSans/unhinted/ttf/NotoSans-Regular.ttf"

    ],



    /* ---------------------------------------------
       Noto Sans Yi

       例如：

       ꒉ

       U+A489
    --------------------------------------------- */

    yi: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSansYi/NotoSansYi-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSansYi/unhinted/ttf/NotoSansYi-Regular.ttf"

    ],



    /* ---------------------------------------------
       Noto Sans Arabic

       例如：

       و
    --------------------------------------------- */

    arabic: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSansArabic/unhinted/ttf/NotoSansArabic-Regular.ttf"

    ],



    /* ---------------------------------------------
       Noto Sans Symbols
    --------------------------------------------- */

    symbols: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSansSymbols2/NotoSansSymbols2-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSansSymbols2/unhinted/ttf/NotoSansSymbols2-Regular.ttf"

    ],



    /* ---------------------------------------------
       ★ 新增

       Noto Sans Math

       專門處理：

       ℋ
       𝓊
       𝒶
       𝓃
       𝑔

       以及其他 Mathematical
       Alphanumeric Symbols
    --------------------------------------------- */

    math: [

        "https://raw.githubusercontent.com/notofonts/noto-fonts/main/unhinted/ttf/NotoSansMath/NotoSansMath-Regular.ttf",

        "https://notofonts.github.io/fonts/NotoSansMath/unhinted/ttf/NotoSansMath-Regular.ttf"

    ]

};



/* =========================================================
   字型容器
========================================================= */

const fonts = {


    roboto: null,

    noto: null,

    yi: null,

    arabic: null,

    symbols: null,

    math: null,

    uploaded: null

};



/* =========================================================
   目前 SVG
========================================================= */

let currentSVG = "";



/* =========================================================
   DOM
========================================================= */

const textInput =
    document.getElementById(
        "textInput"
    );


const fontSizeInput =
    document.getElementById(
        "fontSize"
    );


const generateBtn =
    document.getElementById(
        "generateBtn"
    );


const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );


const preview =
    document.getElementById(
        "preview"
    );


const status =
    document.getElementById(
        "status"
    );


const fontStatus =
    document.getElementById(
        "fontStatus"
    );


const fontFile =
    document.getElementById(
        "fontFile"
    );



/* =========================================================
   載入單一字型
========================================================= */

function loadFont(url) {


    return new Promise(

        (resolve, reject) => {


            opentype.load(

                url,

                function(error, font) {


                    if (error) {

                        reject(error);

                        return;

                    }


                    resolve(font);

                }

            );

        }

    );

}



/* =========================================================
   多網址 fallback
========================================================= */

async function loadFontWithFallback(
    urls
) {


    let lastError = null;


    for (
        const url of urls
    ) {


        try {


            console.log(
                "嘗試載入字型：",
                url
            );


            const font =
                await loadFont(
                    url
                );


            console.log(
                "字型載入成功：",
                url
            );


            return font;


        } catch (error) {


            console.warn(
                "字型載入失敗：",
                url,
                error
            );


            lastError =
                error;

        }

    }


    throw lastError;

}



/* =========================================================
   判斷是否至少有字型
========================================================= */

function hasAnyFont() {


    return !!(

        fonts.roboto ||

        fonts.noto ||

        fonts.yi ||

        fonts.arabic ||

        fonts.symbols ||

        fonts.math ||

        fonts.uploaded

    );

}



/* =========================================================
   字型狀態
========================================================= */

function updateFontStatus() {


    const rows = [];


    function addFontStatus(
        name,
        font
    ) {


        if (font) {


            rows.push(

                `<div class="font-ok">
                    ✓ ${name}：載入成功
                </div>`

            );


        } else {


            rows.push(

                `<div class="font-error">
                    ✕ ${name}：載入失敗
                </div>`

            );

        }

    }



    addFontStatus(
        "Roboto",
        fonts.roboto
    );


    addFontStatus(
        "Noto Sans",
        fonts.noto
    );


    addFontStatus(
        "Noto Sans Yi（ꒉ）",
        fonts.yi
    );


    addFontStatus(
        "Noto Sans Arabic（و）",
        fonts.arabic
    );


    addFontStatus(
        "Noto Sans Symbols",
        fonts.symbols
    );


    /*
        ★ 新增 Math
    */

    addFontStatus(
        "Noto Sans Math（ℋ 𝓊 𝒶 𝓃 𝑔）",
        fonts.math
    );


    if (fonts.uploaded) {


        rows.push(

            `<div class="font-ok">
                ✓ 使用者上傳字型：載入成功
            </div>`

        );

    }


    fontStatus.innerHTML =
        rows.join("");

}



/* =========================================================
   載入全部字型
========================================================= */

async function loadAllFonts() {


    status.textContent =
        "正在載入 Unicode 字型…";


    fontStatus.textContent =
        "正在載入 Unicode 字型…";



    /* ---------------------------------------------
       Roboto
    --------------------------------------------- */

    try {

        fonts.roboto =
            await loadFontWithFallback(
                FONT_URLS.roboto
            );

    } catch (error) {

        console.warn(
            "Roboto 無法載入",
            error
        );

    }



    /* ---------------------------------------------
       Noto Sans
    --------------------------------------------- */

    try {

        fonts.noto =
            await loadFontWithFallback(
                FONT_URLS.noto
            );

    } catch (error) {

        console.warn(
            "Noto Sans 無法載入",
            error
        );

    }



    /* ---------------------------------------------
       Yi
    --------------------------------------------- */

    try {

        fonts.yi =
            await loadFontWithFallback(
                FONT_URLS.yi
            );

    } catch (error) {

        console.warn(
            "Noto Sans Yi 無法載入",
            error
        );

    }



    /* ---------------------------------------------
       Arabic
    --------------------------------------------- */

    try {

        fonts.arabic =
            await loadFontWithFallback(
                FONT_URLS.arabic
            );

    } catch (error) {

        console.warn(
            "Noto Sans Arabic 無法載入",
            error
        );

    }



    /* ---------------------------------------------
       Symbols
    --------------------------------------------- */

    try {

        fonts.symbols =
            await loadFontWithFallback(
                FONT_URLS.symbols
            );

    } catch (error) {

        console.warn(
            "Noto Sans Symbols 無法載入",
            error
        );

    }



    /* ---------------------------------------------
       ★ Math
    --------------------------------------------- */

    try {

        fonts.math =
            await loadFontWithFallback(
                FONT_URLS.math
            );

    } catch (error) {

        console.warn(
            "Noto Sans Math 無法載入",
            error
        );

    }



    /* ---------------------------------------------
       更新狀態
    --------------------------------------------- */

    updateFontStatus();



    /* ---------------------------------------------
       啟用工具
    --------------------------------------------- */

    if (hasAnyFont()) {


        generateBtn.disabled =
            false;


        generateBtn.textContent =
            "送出";


        status.textContent =
            "字型準備完成";


        /*
            自動產生測試文字
        */

        generate();


    } else {


        generateBtn.disabled =
            false;


        generateBtn.textContent =
            "送出";


        status.textContent =
            "遠端字型無法載入";


        fontStatus.innerHTML = `

            <div class="font-error">

                ✕ 遠端字型全部載入失敗

            </div>


            <div style="margin-top:8px;">

                請使用上方
                「上傳 TTF / OTF 字型」

                <br>

                即可使用本機字型進行向量轉換。

            </div>

        `;

    }

}



/* =========================================================
   Glyph 判斷
========================================================= */

function hasGlyph(
    font,
    character
) {


    if (!font) {

        return false;

    }


    try {


        const glyph =
            font.charToGlyph(
                character
            );


        return !!(

            glyph &&

            glyph.index !== 0

        );


    } catch (error) {


        return false;

    }

}



/* =========================================================
   Yi
========================================================= */

function isYi(
    character
) {


    const code =
        character.codePointAt(0);


    return (

        code >= 0xA000 &&

        code <= 0xA4CF

    );

}



/* =========================================================
   Arabic
========================================================= */

function isArabic(
    character
) {


    const code =
        character.codePointAt(0);


    return (

        (
            code >= 0x0600 &&
            code <= 0x06FF
        )

        ||

        (
            code >= 0x0750 &&
            code <= 0x077F
        )

        ||

        (
            code >= 0x08A0 &&
            code <= 0x08FF
        )

    );

}



/* =========================================================
   ★ Mathematical Alphanumeric Symbols
========================================================= */

function isMathCharacter(
    character
) {


    const code =
        character.codePointAt(0);


    /*
        Mathematical Alphanumeric Symbols

        U+1D400 ~ U+1D7FF

        包含：

        𝐀
        𝑨
        𝒜
        𝓐
        𝔄
        𝕬
        𝖠
        𝗔
        𝘈
        𝙰

        等等。
    */


    if (

        code >= 0x1D400 &&

        code <= 0x1D7FF

    ) {

        return true;

    }



    /*
        Letterlike Symbols

        例如：

        ℋ
        ℌ
        ℍ
        ℎ
        ℏ
        ℐ
        ℑ
        ℒ
        ℓ
        ℕ
        ℘
        ℛ
        ℜ
        ℤ

    */

    if (

        code >= 0x2100 &&

        code <= 0x214F

    ) {

        return true;

    }


    return false;

}



/* =========================================================
   Combining Mark
========================================================= */

function isCombiningMark(
    character
) {


    const code =
        character.codePointAt(0);


    return (

        (
            code >= 0x0300 &&
            code <= 0x036F
        )

        ||

        (
            code >= 0x1AB0 &&
            code <= 0x1AFF
        )

        ||

        (
            code >= 0x1DC0 &&
            code <= 0x1DFF
        )

        ||

        (
            code >= 0x20D0 &&
            code <= 0x20FF
        )

        ||

        (
            code >= 0xFE20 &&
            code <= 0xFE2F
        )

    );

}



/* =========================================================
   取得字型
========================================================= */

function getFontForCharacter(
    character
) {


    /*
        ==========================================
        ① 使用者上傳字型
        ==========================================
    */

    if (

        fonts.uploaded &&

        hasGlyph(
            fonts.uploaded,
            character
        )

    ) {

        return fonts.uploaded;

    }



    /*
        ==========================================
        ② Mathematical Characters
        ==========================================
    */

    if (
        isMathCharacter(
            character
        )
    ) {


        if (

            hasGlyph(
                fonts.math,
                character
            )

        ) {

            return fonts.math;

        }

    }



    /*
        ==========================================
        ③ Yi
        ==========================================
    */

    if (
        isYi(
            character
        )
    ) {


        if (

            hasGlyph(
                fonts.yi,
                character
            )

        ) {

            return fonts.yi;

        }

    }



    /*
        ==========================================
        ④ Arabic
        ==========================================
    */

    if (
        isArabic(
            character
        )
    ) {


        if (

            hasGlyph(
                fonts.arabic,
                character
            )

        ) {

            return fonts.arabic;

        }

    }



    /*
        ==========================================
        ⑤ Combining Mark
        ==========================================
    */

    if (
        isCombiningMark(
            character
        )
    ) {


        if (

            hasGlyph(
                fonts.noto,
                character
            )

        ) {

            return fonts.noto;

        }


        if (

            hasGlyph(
                fonts.symbols,
                character
            )

        ) {

            return fonts.symbols;

        }

    }



    /*
        ==========================================
        ⑥ Roboto
        ==========================================
    */

    if (

        hasGlyph(
            fonts.roboto,
            character
        )

    ) {

        return fonts.roboto;

    }



    /*
        ==========================================
        ⑦ Noto Sans
        ==========================================
    */

    if (

        hasGlyph(
            fonts.noto,
            character
        )

    ) {

        return fonts.noto;

    }



    /*
        ==========================================
        ⑧ Symbols
        ==========================================
    */

    if (

        hasGlyph(
            fonts.symbols,
            character
        )

    ) {

        return fonts.symbols;

    }



    return null;

}



/* =========================================================
   取得 Glyph Path
========================================================= */

function getGlyphPath(
    character,
    x,
    y,
    fontSize
) {


    const font =
        getFontForCharacter(
            character
        );


    if (!font) {


        console.warn(

            "找不到 Glyph：",

            character,

            "U+" +

            character
                .codePointAt(0)
                .toString(16)
                .toUpperCase()

        );


        return {

            path: "",

            advance:
                fontSize * 0.5,

            missing: true

        };

    }



    try {


        const glyph =
            font.charToGlyph(
                character
            );


        const path =
            font.getPath(

                character,

                x,

                y,

                fontSize

            );


        let advance =

            glyph.advanceWidth *

            (
                fontSize /
                font.unitsPerEm
            );



        /*
            Combining Mark 不佔寬度
        */

        if (

            isCombiningMark(
                character
            )

        ) {

            advance = 0;

        }


        return {

            path:
                path.toPathData(3),

            advance,

            missing: false

        };


    } catch (error) {


        console.error(

            "Glyph 轉換錯誤：",

            character,

            error

        );


        return {

            path: "",

            advance:
                fontSize * 0.5,

            missing: true

        };

    }

}



/* =========================================================
   建立 SVG
========================================================= */

function createSVG(
    text,
    fontSize
) {


    const lines =
        text.split(/\r?\n/);


    const lineHeight =
        fontSize * 1.35;


    const padding =
        fontSize * 0.3;


    let maxWidth = 0;


    /*
        ==========================================
        計算每行寬度
        ==========================================
    */

    lines.forEach(
        line => {


            let x = 0;


            const chars =
                Array.from(line);


            chars.forEach(
                character => {


                    /*
                        Combining Mark
                        不增加寬度
                    */

                    if (

                        isCombiningMark(
                            character
                        )

                    ) {

                        return;

                    }


                    const result =
                        getGlyphPath(

                            character,

                            0,

                            0,

                            fontSize

                        );


                    x +=
                        result.advance;

                }
            );


            maxWidth =
                Math.max(
                    maxWidth,
                    x
                );

        }
    );



    if (
        maxWidth <= 0
    ) {

        maxWidth =
            fontSize;

    }



    const width =

        maxWidth +

        padding * 2;


    const height =

        Math.max(

            lines.length *
            lineHeight +

            padding * 2,

            fontSize +
            padding * 2

        );



    let pathHTML = "";



    /*
        ==========================================
        建立每一個 Path
        ==========================================
    */

    lines.forEach(

        (
            line,
            lineIndex
        ) => {


            let x =
                padding;


            const baseline =

                padding +

                fontSize +

                lineIndex *
                lineHeight;



            const chars =
                Array.from(line);



            let previousX =
                x;



            chars.forEach(
                character => {


                    /*
                        ==================================
                        Combining Mark
                        ==================================
                    */

                    if (

                        isCombiningMark(
                            character
                        )

                    ) {


                        const markFont =
                            getFontForCharacter(
                                character
                            );


                        if (
                            markFont
                        ) {


                            try {


                                const mark =

                                    markFont.getPath(

                                        character,

                                        previousX,

                                        baseline -
                                        fontSize * 0.72,

                                        fontSize

                                    );


                                const markPath =

                                    mark.toPathData(3);


                                if (
                                    markPath
                                ) {


                                    pathHTML += `

                                        <path
                                            d="${markPath}"
                                            fill="#000000"
                                        />

                                    `;

                                }


                            } catch (error) {


                                console.warn(

                                    "Combining mark error:",

                                    character

                                );

                            }

                        }


                        return;

                    }



                    /*
                        ==================================
                        一般字元
                        ==================================
                    */

                    const result =

                        getGlyphPath(

                            character,

                            x,

                            baseline,

                            fontSize

                        );


                    if (
                        result.path
                    ) {


                        pathHTML += `

                            <path
                                d="${result.path}"
                                fill="#000000"
                            />

                        `;

                    }


                    previousX =
                        x;


                    x +=
                        result.advance;

                }
            );

        }
    );



    /*
        ==========================================
        SVG
        ==========================================
    */

    return `<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width.toFixed(2)}"
    height="${height.toFixed(2)}"
    viewBox="0 0 ${width.toFixed(2)} ${height.toFixed(2)}"
>

    <g fill="#000000">

        ${pathHTML}

    </g>

</svg>`;

}



/* =========================================================
   產生 SVG
========================================================= */

function generate() {


    const text =
        textInput.value;


    const fontSize =
        parseFloat(
            fontSizeInput.value
        );


    if (!text) {


        alert(
            "請先輸入文字"
        );


        return;

    }



    if (

        !fontSize ||

        fontSize <= 0

    ) {


        alert(
            "請輸入正確的字體大小"
        );


        return;

    }



    if (!hasAnyFont()) {


        alert(

            "目前沒有可用的字型。\n\n" +

            "請上傳 TTF / OTF 字型。"

        );


        return;

    }



    try {


        status.textContent =
            "正在轉換成向量…";


        currentSVG =
            createSVG(

                text,

                fontSize

            );


        /*
            顯示 SVG
        */

        preview.innerHTML =
            currentSVG;


        downloadBtn.disabled =
            false;


        status.textContent =
            "完成：SVG Path";


    } catch (error) {


        console.error(
            error
        );


        status.textContent =
            "轉換失敗";


        preview.innerHTML = `

            <div style="
                color:#c00;
                text-align:center;
                line-height:1.8;
            ">

                文字轉向量失敗。

                <br>

                ${error.message}

            </div>

        `;

    }

}



/* =========================================================
   下載 SVG
========================================================= */

function downloadSVG() {


    if (!currentSVG) {


        alert(
            "請先按「送出」"
        );


        return;

    }



    const blob =

        new Blob(

            [currentSVG],

            {

                type:
                    "image/svg+xml;charset=utf-8"

            }

        );



    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "text-outline.svg";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(

        () => {

            URL.revokeObjectURL(
                url
            );

        },

        1000

    );


    status.textContent =
        "SVG 已下載";

}



/* =========================================================
   上傳 TTF / OTF
========================================================= */

fontFile.addEventListener(

    "change",

    function(event) {


        const file =
            event.target.files[0];


        if (!file) {

            return;

        }



        const reader =
            new FileReader();



        reader.onload =
            function(e) {


                try {


                    fonts.uploaded =

                        opentype.parse(
                            e.target.result
                        );


                    updateFontStatus();


                    generateBtn.disabled =
                        false;


                    status.textContent =
                        "自訂字型載入完成";


                    /*
                        自動重新產生
                    */

                    generate();


                } catch (error) {


                    console.error(
                        error
                    );


                    alert(

                        "無法讀取這個 TTF / OTF 字型檔。"

                    );

                }

            };



        reader.readAsArrayBuffer(
            file
        );

    }

);



/* =========================================================
   Events
========================================================= */

generateBtn.addEventListener(

    "click",

    generate

);


downloadBtn.addEventListener(

    "click",

    downloadSVG

);



/*
    Ctrl + Enter
*/

textInput.addEventListener(

    "keydown",

    event => {


        if (

            event.ctrlKey &&

            event.key === "Enter"

        ) {


            generate();

        }

    }

);



/* =========================================================
   啟動
========================================================= */

loadAllFonts();

</script>
