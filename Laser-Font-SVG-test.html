<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>文字轉 SVG 向量路徑</title>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 20px;

    background: #f4f5f7;

    color: #222;

    font-family:
        "Roboto",
        "Droid Sans",
        Arial,
        sans-serif;
}

.container {
    width: min(100%, 1000px);
    margin: 0 auto;
}

.header {
    margin-bottom: 25px;
}

.header h1 {
    margin: 0 0 8px;

    font-size: 28px;
    font-weight: 700;
}

.header p {
    margin: 0;

    color: #777;

    font-size: 14px;
}

.card {
    background: #fff;

    border-radius: 16px;

    padding: 24px;

    margin-bottom: 20px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.06);
}

label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;
    font-weight: 600;
}

textarea {
    width: 100%;

    min-height: 130px;

    resize: vertical;

    padding: 16px;

    border: 1px solid #ddd;

    border-radius: 10px;

    outline: none;

    font-family:
        "Roboto",
        "Droid Sans",
        Arial,
        sans-serif;

    font-size: 32px;

    line-height: 1.5;

    color: #000;

    transition: .2s;
}

textarea:focus {
    border-color: #888;

    box-shadow:
        0 0 0 3px rgba(0,0,0,.05);
}

.settings {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 16px;

    margin-top: 18px;
}

.field {
    display: flex;

    flex-direction: column;
}

input {
    width: 100%;

    height: 44px;

    padding: 0 12px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 15px;

    outline: none;
}

input:focus {
    border-color: #888;
}

.buttons {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

button {
    border: 0;

    border-radius: 9px;

    padding: 12px 22px;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}

.btn-primary {
    background: #111;

    color: #fff;
}

.btn-primary:hover {
    background: #333;

    transform: translateY(-1px);
}

.btn-download {
    background: #e9ecef;

    color: #222;
}

.btn-download:hover {
    background: #dfe3e6;
}

button:disabled {
    opacity: .4;

    cursor: not-allowed;

    transform: none;
}

.preview-title {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 14px;
}

.preview-title h2 {
    margin: 0;

    font-size: 18px;
}

.status {
    font-size: 13px;

    color: #777;
}

.preview {
    width: 100%;

    min-height: 300px;

    border: 1px solid #ddd;

    border-radius: 12px;

    background:
        linear-gradient(
            45deg,
            #f0f0f0 25%,
            transparent 25%
        ),
        linear-gradient(
            -45deg,
            #f0f0f0 25%,
            transparent 25%
        ),
        linear-gradient(
            45deg,
            transparent 75%,
            #f0f0f0 75%
        ),
        linear-gradient(
            -45deg,
            transparent 75%,
            #f0f0f0 75%
        );

    background-size: 20px 20px;

    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: auto;

    padding: 30px;
}

.preview svg {
    display: block;

    max-width: 100%;

    height: auto;

    overflow: visible;
}

.info {
    margin-top: 16px;

    padding: 14px 16px;

    border-radius: 9px;

    background: #f7f7f7;

    font-size: 13px;

    line-height: 1.7;

    color: #666;
}

.info strong {
    color: #222;
}

@media (max-width: 650px) {

    body {
        padding: 20px 12px;
    }

    .card {
        padding: 18px;
    }

    .settings {
        grid-template-columns: 1fr;
    }

    textarea {
        font-size: 24px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>
</head>


<body>

<div class="container">


    <div class="header">

        <h1>
            文字 → SVG 向量路徑
        </h1>

        <p>
            Unicode 文字自動尋找 Glyph，轉換成 Illustrator 可編輯的 Path
        </p>

    </div>


    <!-- ====================================
         輸入
    ===================================== -->

    <div class="card">

        <label for="textInput">
            輸入文字
        </label>

        <textarea id="textInput">Eggꒉ:)و ̑̑</textarea>


        <div class="settings">

            <div class="field">

                <label for="fontSize">
                    字體大小
                </label>

                <input
                    id="fontSize"
                    type="number"
                    value="120"
                    min="10"
                    max="1000"
                >

            </div>


            <div class="field">

                <label>
                    主要字型
                </label>

                <input
                    type="text"
                    value="Roboto"
                    readonly
                >

            </div>

        </div>


        <div class="buttons">

            <button
                id="generateBtn"
                class="btn-primary"
                disabled
            >
                載入字型中…
            </button>


            <button
                id="downloadBtn"
                class="btn-download"
                disabled
            >
                下載 SVG 向量檔
            </button>

        </div>

    </div>


    <!-- ====================================
         預覽
    ===================================== -->

    <div class="card">

        <div class="preview-title">

            <h2>
                向量預覽
            </h2>

            <span
                id="status"
                class="status"
            >
                載入字型中…
            </span>

        </div>


        <div
            id="preview"
            class="preview"
        >

            <span style="color:#999;">
                正在載入字型…
            </span>

        </div>


        <div class="info">

            <strong>
                Path 向量模式
            </strong>

            <br>

            SVG 不會保留
            <code>&lt;text&gt;</code>
            元素。

            <br>

            每個字元都會轉換成真正的
            <strong>SVG Path</strong>，
            Illustrator 開啟後可以直接編輯節點。

        </div>

    </div>


</div>


<script>

/* ==========================================================
   字型
========================================================== */


/*
    主要字型
    Latin / 基本符號
*/
const FONT_ROBOTO =
    "https://notofonts.github.io/roboto/unhinted/ttf/Roboto-Regular.ttf";


/*
    Noto Sans
    一般 Unicode fallback
*/
const FONT_NOTO =
    "https://notofonts.github.io/fonts/NotoSans/unhinted/ttf/NotoSans-Regular.ttf";


/*
    Noto Sans Yi

    專門處理：

    ꒉ

    U+A489
*/
const FONT_YI =
    "https://notofonts.github.io/fonts/NotoSansYi/unhinted/ttf/NotoSansYi-Regular.ttf";


/*
    Noto Sans Arabic

    專門處理：

    و

*/
const FONT_ARABIC =
    "https://notofonts.github.io/fonts/NotoSansArabic/unhinted/ttf/NotoSansArabic-Regular.ttf";


/*
    Symbols

    補充特殊符號
*/
const FONT_SYMBOLS =
    "https://notofonts.github.io/fonts/NotoSansSymbols2/unhinted/ttf/NotoSansSymbols2-Regular.ttf";


/* ==========================================================
   字型變數
========================================================== */

let fonts = {
    roboto: null,
    noto: null,
    yi: null,
    arabic: null,
    symbols: null
};


let currentSVG = "";


/* ==========================================================
   DOM
========================================================== */

const textInput =
    document.getElementById("textInput");

const fontSizeInput =
    document.getElementById("fontSize");

const generateBtn =
    document.getElementById("generateBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const preview =
    document.getElementById("preview");

const status =
    document.getElementById("status");


/* ==========================================================
   載入單一字型
========================================================== */

function loadFont(url) {

    return new Promise(
        (resolve, reject) => {

            opentype.load(
                url,
                function(error, font) {

                    if (error) {

                        reject(error);

                    } else {

                        resolve(font);

                    }

                }
            );

        }
    );

}


/* ==========================================================
   載入全部字型
========================================================== */

async function loadAllFonts() {

    status.textContent =
        "正在載入 Unicode 字型…";


    try {

        const results =
            await Promise.all([

                loadFont(
                    FONT_ROBOTO
                ),

                loadFont(
                    FONT_NOTO
                ),

                loadFont(
                    FONT_YI
                ),

                loadFont(
                    FONT_ARABIC
                ),

                loadFont(
                    FONT_SYMBOLS
                )

            ]);


        fonts.roboto =
            results[0];

        fonts.noto =
            results[1];

        fonts.yi =
            results[2];

        fonts.arabic =
            results[3];

        fonts.symbols =
            results[4];


        status.textContent =
            "字型載入完成";


        generateBtn.disabled =
            false;


        generateBtn.textContent =
            "送出";


        /*
            自動先產生測試文字
        */

        generate();


    } catch (error) {

        console.error(
            "Font loading error:",
            error
        );


        status.textContent =
            "字型載入失敗";


        preview.innerHTML = `
            <div style="
                color:#c00;
                text-align:center;
                line-height:1.8;
            ">
                字型載入失敗。<br>
                請確認 GitHub Pages 可以連線。
            </div>
        `;

    }

}


/* ==========================================================
   判斷 Glyph
========================================================== */

function hasGlyph(
    font,
    character
) {

    if (!font) {
        return false;
    }


    try {

        const glyph =
            font.charToGlyph(
                character
            );


        /*
            index 0 通常是 .notdef
        */

        return (
            glyph &&
            glyph.index !== 0
        );

    } catch (error) {

        return false;

    }

}


/* ==========================================================
   取得 Unicode 字型
========================================================== */

function getFontForCharacter(
    character
) {

    const code =
        character.codePointAt(0);


    /*
        ===================================
        Yi
        U+A000 - U+A4CF
        ===================================
    */

    if (
        code >= 0xA000 &&
        code <= 0xA4CF
    ) {

        if (
            hasGlyph(
                fonts.yi,
                character
            )
        ) {

            return fonts.yi;

        }

    }


    /*
        ===================================
        Arabic
        ===================================
    */

    if (
        (
            code >= 0x0600 &&
            code <= 0x06FF
        )
        ||
        (
            code >= 0x0750 &&
            code <= 0x077F
        )
        ||
        (
            code >= 0x08A0 &&
            code <= 0x08FF
        )
    ) {

        if (
            hasGlyph(
                fonts.arabic,
                character
            )
        ) {

            return fonts.arabic;

        }

    }


    /*
        ===================================
        Combining Marks
        ===================================
    */

    if (
        isCombiningMark(
            character
        )
    ) {

        if (
            hasGlyph(
                fonts.noto,
                character
            )
        ) {

            return fonts.noto;

        }

        if (
            hasGlyph(
                fonts.symbols,
                character
            )
        ) {

            return fonts.symbols;

        }

    }


    /*
        ===================================
        一般 Latin
        ===================================
    */

    if (
        hasGlyph(
            fonts.roboto,
            character
        )
    ) {

        return fonts.roboto;

    }


    /*
        ===================================
        Noto Sans fallback
        ===================================
    */

    if (
        hasGlyph(
            fonts.noto,
            character
        )
    ) {

        return fonts.noto;

    }


    /*
        ===================================
        Symbols fallback
        ===================================
    */

    if (
        hasGlyph(
            fonts.symbols,
            character
        )
    ) {

        return fonts.symbols;

    }


    return null;

}


/* ==========================================================
   判斷組合符號
========================================================== */

function isCombiningMark(
    character
) {

    const code =
        character.codePointAt(0);


    /*
        Unicode Combining Diacritical Marks
    */

    return (

        code >= 0x0300 &&
        code <= 0x036F

    );

}


/* ==========================================================
   取得字元 Path
========================================================== */

function getGlyphPath(
    character,
    x,
    y,
    fontSize
) {

    const font =
        getFontForCharacter(
            character
        );


    if (!font) {

        console.warn(
            "找不到 Glyph：",
            character,
            "U+" +
            character
                .codePointAt(0)
                .toString(16)
                .toUpperCase()
        );


        return {
            path: "",
            advance: fontSize * 0.5,
            missing: true
        };

    }


    try {

        const glyph =
            font.charToGlyph(
                character
            );


        /*
            OpenType Glyph Path
        */

        const path =
            font.getPath(
                character,
                x,
                y,
                fontSize
            );


        /*
            字寬
        */

        let advance =
            glyph.advanceWidth *
            (
                fontSize /
                font.unitsPerEm
            );


        /*
            組合符號不應增加字寬
        */

        if (
            isCombiningMark(
                character
            )
        ) {

            advance = 0;

        }


        return {

            path:
                path.toPathData(3),

            advance:
                advance,

            missing: false

        };

    } catch (error) {

        console.warn(
            "Glyph error:",
            character,
            error
        );


        return {

            path: "",

            advance:
                fontSize * 0.5,

            missing: true

        };

    }

}


/* ==========================================================
   文字轉 SVG
========================================================== */

function createSVG(
    text,
    fontSize
) {

    const lines =
        text.split(/\r?\n/);


    const lineHeight =
        fontSize * 1.25;


    const padding =
        fontSize * 0.3;


    /*
        =====================================
        先計算每行寬度
        =====================================
    */

    let lineWidths = [];

    let maxWidth = 0;


    lines.forEach(
        line => {

            let x = 0;


            const chars =
                Array.from(line);


            chars.forEach(
                character => {

                    /*
                        組合符號不需要佔寬
                    */

                    if (
                        isCombiningMark(
                            character
                        )
                    ) {

                        return;

                    }


                    const result =
                        getGlyphPath(
                            character,
                            0,
                            0,
                            fontSize
                        );


                    x +=
                        result.advance;

                }
            );


            lineWidths.push(x);


            maxWidth =
                Math.max(
                    maxWidth,
                    x
                );

        }
    );


    /*
        避免空文字
    */

    if (
        maxWidth <= 0
    ) {

        maxWidth =
            fontSize;

    }


    const width =
        maxWidth +
        padding * 2;


    const height =
        Math.max(
            lines.length *
            lineHeight +
            padding * 2,
            fontSize +
            padding * 2
        );


    /*
        =====================================
        建立 Path
        =====================================
    */

    let pathHTML = "";


    lines.forEach(
        (line, lineIndex) => {

            let x =
                padding;


            let baseline =
                padding +
                fontSize +
                lineIndex *
                lineHeight;


            const chars =
                Array.from(line);


            /*
                記錄上一個正常 Glyph
                用來放 combining mark
            */

            let previousX =
                x;


            let previousAdvance = 0;


            chars.forEach(
                character => {

                    /*
                        =========================
                        Combining Mark
                        =========================
                    */

                    if (
                        isCombiningMark(
                            character
                        )
                    ) {

                        const markFont =
                            getFontForCharacter(
                                character
                            );


                        if (
                            markFont
                        ) {

                            try {

                                /*
                                    組合符號放在
                                    前一個字元 / 空白
                                    的上方。

                                    這裡使用稍微上移
                                    的方式處理。
                                */

                                const mark =
                                    markFont.getPath(
                                        character,
                                        previousX,
                                        baseline -
                                        fontSize * 0.72,
                                        fontSize
                                    );


                                const markPath =
                                    mark.toPathData(3);


                                if (
                                    markPath
                                ) {

                                    pathHTML +=
                                        `
                                        <path
                                            d="${markPath}"
                                            fill="#000000"
                                        />
                                        `;

                                }

                            } catch (error) {

                                console.warn(
                                    "Combining mark error:",
                                    character
                                );

                            }

                        }


                        return;

                    }


                    /*
                        =========================
                        一般字元
                        =========================
                    */

                    const result =
                        getGlyphPath(
                            character,
                            x,
                            baseline,
                            fontSize
                        );


                    if (
                        result.path
                    ) {

                        pathHTML +=
                            `
                            <path
                                d="${result.path}"
                                fill="#000000"
                            />
                            `;

                    }


                    previousX =
                        x;


                    previousAdvance =
                        result.advance;


                    x +=
                        result.advance;

                }
            );

        }
    );


    /*
        =====================================
        SVG
        =====================================
    */

    return `<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width.toFixed(2)}"
    height="${height.toFixed(2)}"
    viewBox="0 0 ${width.toFixed(2)} ${height.toFixed(2)}"
>
    <g fill="#000000">
        ${pathHTML}
    </g>
</svg>`;

}


/* ==========================================================
   送出
========================================================== */

function generate() {

    const text =
        textInput.value;


    const fontSize =
        parseFloat(
            fontSizeInput.value
        );


    if (!text) {

        alert(
            "請先輸入文字"
        );

        return;

    }


    if (
        !fontSize ||
        fontSize <= 0
    ) {

        alert(
            "請輸入正確的字體大小"
        );

        return;

    }


    if (
        !fonts.roboto ||
        !fonts.noto ||
        !fonts.yi ||
        !fonts.arabic ||
        !fonts.symbols
    ) {

        alert(
            "字型尚未載入完成，請稍候。"
        );

        return;

    }


    try {

        status.textContent =
            "正在轉換成向量…";


        currentSVG =
            createSVG(
                text,
                fontSize
            );


        /*
            顯示真正 SVG Path
        */

        preview.innerHTML =
            currentSVG;


        downloadBtn.disabled =
            false;


        status.textContent =
            "完成：全部為 SVG Path";


    } catch (error) {

        console.error(error);


        status.textContent =
            "轉換失敗";


        preview.innerHTML = `
            <div style="
                color:#c00;
                text-align:center;
                line-height:1.8;
            ">
                文字轉向量失敗。<br>
                ${error.message}
            </div>
        `;

    }

}


/* ==========================================================
   下載
========================================================== */

function downloadSVG() {

    if (!currentSVG) {

        alert(
            "請先按「送出」"
        );

        return;

    }


    const blob =
        new Blob(
            [
                currentSVG
            ],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "text-outline.svg";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    status.textContent =
        "SVG 已下載";

}


/* ==========================================================
   Events
========================================================== */

generateBtn.addEventListener(
    "click",
    generate
);


downloadBtn.addEventListener(
    "click",
    downloadSVG
);


/*
    Ctrl + Enter
*/

textInput.addEventListener(
    "keydown",
    event => {

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            generate();

        }

    }
);


/* ==========================================================
   開始載入
========================================================== */

loadAllFonts();

</script>

</body>
</html>
