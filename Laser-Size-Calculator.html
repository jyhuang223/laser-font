<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毫米 (mm) 比例計算器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #3182ce;
        }
        .result-box {
            background-color: #ebf8ff;
            border: 1px solid #bee3f8;
            padding: 15px;
            border-radius: 6px;
            margin-top: 25px;
            text-align: center;
        }
        .result-label {
            font-size: 14px;
            color: #2b6cb0;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #2b6cb0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>毫米比例計算器</h2>
    
    <div class="form-group">
        <label for="mmInput">請輸入長度 (mm)：</label>
        <input type="number" id="mmInput" placeholder="例如: 100" min="0" step="any">
    </div>
    
    <div class="form-group">
        <label for="ratioSelect">請選擇比例：</label>
        <select id="ratioSelect">
            <option value="0.70">70%</option>
            <option value="0.65">65%</option>
            <option value="0.60">60%</option>
        </select>
    </div>
    
    <div class="result-box">
        <div class="result-label">計算結果</div>
        <div class="result-value"><span id="resultDisplay">0</span> mm</div>
    </div>
</div>

<script>
    // 獲取 DOM 元素
    const mmInput = document.getElementById('mmInput');
    const ratioSelect = document.getElementById('ratioSelect');
    const resultDisplay = document.getElementById('resultDisplay');

    // 計算邏輯
    function calculate() {
        const mmValue = parseFloat(mmInput.value);
        const ratioValue = parseFloat(ratioSelect.value);

        // 檢查輸入是否為有效數字
        if (isNaN(mmValue)) {
            resultDisplay.textContent = '0';
            return;
        }

        // 計算結果 (四捨五入到小數點後兩位，避免 JavaScript 浮點數誤差)
        const result = (mmValue * ratioValue).toFixed(2);
        
        // 去除尾隨的 0 (例如 70.00 變成 70)
        resultDisplay.textContent = parseFloat(result);
    }

    // 監聽輸入框與下拉選單的變更事件，達成即時計算
    mmInput.addEventListener('input', calculate);
    ratioSelect.addEventListener('change', calculate);
</script>

</body>
</html>
