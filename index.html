<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 文字向量即時預覽器</title>
    <!-- 引入線上的 Roboto 字型確保複現度 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .flex-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: "Roboto", "Droid Sans", Arial, sans-serif;
        }
        input[type="range"] {
            flex: 1;
        }
        input[type="number"] {
            width: 70px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .preview-box {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            background: #fff;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            margin-top: 10px;
            overflow: auto;
        }
        svg {
            max-width: 100%;
            height: auto;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>SVG 向量文字即時預覽器</h2>
    <p style="color: #666; font-size: 14px;">修改下方欄位，預覽區域將會即時更新。</p>
    
    <!-- 文字輸入 -->
    <div class="input-group">
        <label for="textInput">請輸入文字：</label>
        <input type="text" id="textInput" value="Eggꒉ:)و" placeholder="輸入文字...">
    </div>

    <!-- 字型大小調整 -->
    <div class="input-group">
        <label for="sizeSlider">文字大小 (px)：</label>
        <div class="flex-group">
            <input type="range" id="sizeSlider" min="10" max="200" value="80">
            <input type="number" id="sizeInput" min="10" max="200" value="80">
        </div>
    </div>
    
    <label>即時預覽：</label>
    <div class="preview-box" id="previewBox">
        <!-- SVG 會被動態插入到這裡 -->
    </div>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeInput = document.getElementById('sizeInput');
    const previewBox = document.getElementById('previewBox');

    // 初始化與事件綁定
    window.onload = function() {
        updateSVG();
        
        // 監聽文字輸入（即時）
        textInput.addEventListener('input', updateSVG);
        
        // 監聽滑桿（拖曳時即時更新，並連動數字輸入框）
        sizeSlider.addEventListener('input', function() {
            sizeInput.value = this.value;
            updateSVG();
        });
        
        // 監聽數字輸入框（手動輸入時更新，並連動滑桿）
        sizeInput.addEventListener('input', function() {
            // 限制範圍避免破版
            let val = parseInt(this.value) || 10;
            if (val < 10) val = 10;
            if (val > 200) val = 200;
            
            sizeSlider.value = val;
            updateSVG();
        });
    };

    function updateSVG() {
        const text = textInput.value;
        const fontSize = sizeSlider.value;
        
        // 動態計算寬度與高度，確保大字型或長文字不會被裁切
        const svgWidth = Math.max(400, text.length * (fontSize * 0.6)); 
        const svgHeight = Math.max(150, fontSize * 1.8);

        // 建立符合需求樣式的 SVG 內容
        const svgCode = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width="${svgWidth}" height="${svgHeight}">
  <style>
    .vector-text {
      font-family: "Roboto", "Droid Sans", Arial, sans-serif;
      font-size: ${fontSize}px;
      fill: #000000;
      user-select: none;
    }
  </style>
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="vector-text">${escapeHtml(text)}</text>
</svg>`;

        previewBox.innerHTML = svgCode;
    }

    // 安全處理特殊 HTML 字元
    function escapeHtml(string) {
        return string.replace(/&/g, '&amp;')
                     .replace(/</g, '&lt;')
                     .replace(/>/g, '&gt;')
                     .replace(/"/g, '&quot;')
                     .replace(/'/g, '&#039;');
    }
</script>

</body>
</html>
